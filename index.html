<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Ujian - Fikih</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Anti-Cheat CSS */
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-600 to-blue-900 min-h-screen font-sans text-slate-800" oncontextmenu="return false;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // KONFIGURASI UJIAN
        // ==========================================
        const GOOGLE_SHEETS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz_4PlRBN03kigqoEiztltmkLNr7Yd6w8EQQpEaaBlLlmMNCjhKkUYvXQ1F7H_mx2o-ow/exec"; // GANTI DENGAN URL WEB APP GAS ANDA
        const EXAM_CONFIG = {
            mapel: "Fikih",
            jenis: "SUMATIF AKHIR JENJANG (SAJ) 2025/2026",
            kelas: "VIII",
            durasiMenit: 90,
            storageKey: "cbt_fikih_VIII"
        };

        // ==========================================
        // DATA SOAL (Diekstrak dari PDF)
        // ==========================================
        const rawQuestionsData = [
            { id: 1, type: 'mc', question: "Shalat jamak adalah shalat yang dikerjakan dengan cara...", options: [{ text: "Digabung waktunya", isCorrect: true }, { text: "Dikurangi rakaatnya", isCorrect: false }, { text: "Ditambah rakaatnya", isCorrect: false }, { text: "Dikerjakan berjamaah", isCorrect: false }] },
            { id: 2, type: 'mc', question: "Shalat qashar adalah shalat yang dikerjakan dengan cara...", options: [{ text: "Mengulang shalat", isCorrect: false }, { text: "Meringkas rakaat", isCorrect: true }, { text: "Mengakhirkan shalat", isCorrect: false }, { text: "Menambah bacaan", isCorrect: false }] },
            { id: 3, type: 'mc', question: "Jamak taqdim dilakukan pada...", options: [{ text: "Waktu shalat pertama", isCorrect: true }, { text: "Waktu malam saja", isCorrect: false }, { text: "Waktu shalat kedua", isCorrect: false }, { text: "Waktu subuh saja", isCorrect: false }] },
            { id: 4, type: 'mc', question: "Jamak ta'khir dilakukan pada...", options: [{ text: "Waktu shalat pertama", isCorrect: false }, { text: "Sebelum masuk waktu", isCorrect: false }, { text: "Waktu shalat kedua", isCorrect: true }, { text: "Setelah subuh", isCorrect: false }] },
            { id: 5, type: 'mc', question: "Shalat yang boleh dijamak adalah...", options: [{ text: "Subuh dan Zuhur", isCorrect: false }, { text: "Ashar dan Maghrib", isCorrect: false }, { text: "Zuhur dan Ashar", isCorrect: true }, { text: "Subuh dan Isya", isCorrect: false }] },
            { id: 6, type: 'mc', question: "Pasangan shalat yang boleh dijamak adalah...", options: [{ text: "Maghrib dan Isya", isCorrect: true }, { text: "Ashar dan Isya", isCorrect: false }, { text: "Subuh dan Zuhur", isCorrect: false }, { text: "Subuh dan Ashar", isCorrect: false }] },
            { id: 7, type: 'mc', question: "Shalat yang boleh diqashar adalah shalat yang berjumlah...", options: [{ text: "2 rakaat", isCorrect: false }, { text: "4 rakaat", isCorrect: true }, { text: "3 rakaat", isCorrect: false }, { text: "5 rakaat", isCorrect: false }] },
            { id: 8, type: 'mc', question: "Shalat yang tidak boleh diqashar adalah...", options: [{ text: "Zuhur", isCorrect: false }, { text: "Isya", isCorrect: false }, { text: "Ashar", isCorrect: false }, { text: "Maghrib", isCorrect: true }] },
            { id: 9, type: 'mc', question: "Jumlah rakaat shalat Zuhur ketika diqashar menjadi...", options: [{ text: "1 rakaat", isCorrect: false }, { text: "3 rakaat", isCorrect: false }, { text: "2 rakaat", isCorrect: true }, { text: "4 rakaat", isCorrect: false }] },
            { id: 10, type: 'mc', question: "Salah satu syarat umum shalat jamak dan qashar adalah...", options: [{ text: "Sedang musafir", isCorrect: true }, { text: "Sedang di rumah", isCorrect: false }, { text: "Sedang sakit ringan", isCorrect: false }, { text: "Sedang bermain", isCorrect: false }] },
            { id: 11, type: 'mc', question: "Perjalanan yang membolehkan jamak dan qashar sebaiknya bukan untuk...", options: [{ text: "Mencari ilmu", isCorrect: false }, { text: "Kemaksiatan", isCorrect: true }, { text: "Silaturahmi", isCorrect: false }, { text: "Berdagang halal", isCorrect: false }] },
            { id: 12, type: 'mc', question: "Urutan jamak taqdim Zuhur dan Ashar yang benar adalah...", options: [{ text: "Ashar lalu Zuhur", isCorrect: false }, { text: "Subuh lalu Zuhur", isCorrect: false }, { text: "Zuhur lalu Ashar", isCorrect: true }, { text: "Maghrib lalu Ashar", isCorrect: false }] },
            { id: 13, type: 'mc', question: "Niat jamak taqdim dilakukan saat...", options: [{ text: "Shalat pertama", isCorrect: true }, { text: "Sebelum tidur", isCorrect: false }, { text: "Setelah salam kedua", isCorrect: false }, { text: "Setelah pulang", isCorrect: false }] },
            { id: 14, type: 'mc', question: "Contoh pelaksanaan jamak ta'khir adalah...", options: [{ text: "Zuhur dan Ashar di waktu Ashar", isCorrect: true }, { text: "Maghrib dan Isya di waktu Maghrib", isCorrect: false }, { text: "Zuhur dan Ashar di waktu Zuhur", isCorrect: false }, { text: "Subuh dan Zuhur di waktu Subuh", isCorrect: false }] },
            { id: 15, type: 'mc', question: "Shalat jenazah hukumnya...", options: [{ text: "Fardu ain", isCorrect: false }, { text: "Sunah biasa", isCorrect: false }, { text: "Fardu kifayah", isCorrect: true }, { text: "Mubah", isCorrect: false }] },
            { id: 16, type: 'mc', question: "Shalat jenazah dilakukan tanpa...", options: [{ text: "Niat", isCorrect: false }, { text: "Takbir", isCorrect: false }, { text: "Rukuk dan sujud", isCorrect: true }, { text: "Salam", isCorrect: false }] },
            { id: 17, type: 'mc', question: "Jumlah takbir dalam shalat jenazah adalah...", options: [{ text: "2 takbir", isCorrect: false }, { text: "3 takbir", isCorrect: false }, { text: "4 takbir", isCorrect: true }, { text: "5 takbir", isCorrect: false }] },
            { id: 18, type: 'mc', question: "Bacaan setelah takbir pertama dalam shalat jenazah adalah...", options: [{ text: "Al-Fatihah", isCorrect: true }, { text: "Tahiyat", isCorrect: false }, { text: "Doa qunut", isCorrect: false }, { text: "Adzan", isCorrect: false }] },
            { id: 19, type: 'mc', question: "Bacaan setelah takbir kedua dalam shalat jenazah adalah...", options: [{ text: "Shalawat", isCorrect: true }, { text: "Sujud tilawah", isCorrect: false }, { text: "Iqamah", isCorrect: false }, { text: "Tasyahud akhir", isCorrect: false }] },
            { id: 20, type: 'mc', question: "Seorang musafir menempuh perjalanan jauh dari pagi hingga sore. Ia belum shalat Zuhur dan tiba saat waktu Ashar. Cara yang tepat adalah...", options: [{ text: "Jamak ta'khir Zuhur dan Ashar", isCorrect: true }, { text: "Qashar Subuh dan Maghrib", isCorrect: false }, { text: "Jamak taqdim Zuhur dan Ashar", isCorrect: false }, { text: "Mengganti dengan shalat jenazah", isCorrect: false }] },
            { id: 21, type: 'essay', question: "Jelaskan pengertian shalat jamak dan shalat qashar secara singkat.", answer: "jamak menggabungkan, qashar meringkas" },
            { id: 22, type: 'essay', question: "Sebutkan shalat apa saja yang boleh dijamak dan shalat apa saja yang boleh diqashar.", answer: "jamak: zuhur, ashar, maghrib, isya. qashar: zuhur, ashar, isya" },
            { id: 23, type: 'essay', question: "Jelaskan perbedaan jamak taqdim dan jamak ta'khir.", answer: "taqdim waktu pertama, ta'khir waktu kedua" },
            { id: 24, type: 'essay', question: "Sebutkan rukun utama shalat jenazah secara berurutan.", answer: "niat, takbir, al-fatihah, shalawat, doa, salam" },
            { id: 25, type: 'essay', question: "Seorang musafir berangkat sebelum Zuhur dan diperkirakan baru berhenti saat waktu Ashar. Ia ingin melaksanakan shalat Zuhur dan Ashar ketika berhenti. Jelaskan jenis shalat yang tepat dan cara pelaksanaannya secara singkat.", answer: "jamak ta'khir" }
        ];

        // ==========================================
        // KOMPONEN IKON SVG (React Anti-Crash)
        // ==========================================
        const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-500 mb-4 mx-auto"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

        // ==========================================
        // KOMPONEN MODAL CUSTOM
        // ==========================================
        const CustomModal = ({ isOpen, title, message, type = "alert", onConfirm, onCancel, confirmText = "OK" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 backdrop-blur-md">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 text-center transform transition-all">
                        {type === "alert" && <IconAlert />}
                        <h2 className="text-2xl font-bold text-gray-800 mb-2">{title}</h2>
                        <p className="text-gray-600 mb-6">{message}</p>
                        <div className="flex justify-center gap-3">
                            {type === "confirm" && (
                                <button onClick={onCancel} className="px-6 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300 transition-colors">
                                    Batal
                                </button>
                            )}
                            <button onClick={onConfirm} className={`px-6 py-2 rounded-lg font-semibold text-white transition-colors shadow-md ${type === 'alert' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // KOMPONEN UTAMA (APP)
        // ==========================================
        const App = () => {
            const [view, setView] = useState("login"); // "login", "resume", "exam", "finished"
            const [userData, setUserData] = useState({ nama: "", kelas: "", tanggal: new Date().toISOString().split('T')[0] });
            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(EXAM_CONFIG.durasiMenit * 60);
            const [violations, setViolations] = useState(0);
            const [activeIdx, setActiveIdx] = useState(0);
            
            const [modal, setModal] = useState({ isOpen: false, type: "alert", title: "", message: "", onConfirm: null, onCancel: null, confirmText: "OK" });
            const isSubmitting = useRef(false);

            // Cek LocalStorage saat pertama mount
            useEffect(() => {
                const saved = localStorage.getItem(EXAM_CONFIG.storageKey);
                if (saved) {
                    setView("resume");
                }
            }, []);

            // Strict Anti-Cheat: Mencegah Keyboard Shortcuts (Copy/Paste/Print)
            useEffect(() => {
                const blockKeys = (e) => {
                    if (e.ctrlKey && ['c', 'v', 'u', 'p', 'x'].includes(e.key.toLowerCase())) e.preventDefault();
                };
                window.addEventListener("keydown", blockKeys);
                window.addEventListener("copy", (e) => e.preventDefault());
                window.addEventListener("paste", (e) => e.preventDefault());
                return () => {
                    window.removeEventListener("keydown", blockKeys);
                    window.removeEventListener("copy", (e) => e.preventDefault());
                    window.removeEventListener("paste", (e) => e.preventDefault());
                }
            }, []);

            // Timer Countdown & LocalStorage Auto-Save 
            useEffect(() => {
                let timer;
                if (view === "exam" && !isSubmitting.current) {
                    timer = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                handleAutoSubmit("Waktu Habis");
                                return 0;
                            }
                            return prev - 1;
                        });
                        saveToLocal(); // Auto-save real-time
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [view, answers, activeIdx, violations]);

            // Deteksi Pindah Tab & Fullscreen
            useEffect(() => {
                if (view !== "exam") return;
                
                const handleVisibility = () => {
                    if (document.hidden && !isSubmitting.current && !modal.isOpen) registerViolation();
                };
                const handleFullscreen = () => {
                    if (!document.fullscreenElement && !isSubmitting.current && !modal.isOpen) registerViolation();
                };

                document.addEventListener("visibilitychange", handleVisibility);
                document.addEventListener("fullscreenchange", handleFullscreen);
                
                return () => {
                    document.removeEventListener("visibilitychange", handleVisibility);
                    document.removeEventListener("fullscreenchange", handleFullscreen);
                };
            }, [view, violations, modal.isOpen]);

            // Fungsi Algoritma Fisher-Yates untuk Acak Soal
            const shuffleArray = (arr) => {
                let array = [...arr];
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            };

            const initializeQuestions = () => {
                let processed = rawQuestionsData.map(q => {
                    let newQ = { ...q };
                    if (newQ.type === 'mc') {
                        newQ.options = shuffleArray(newQ.options);
                    }
                    return newQ;
                });
                return shuffleArray(processed);
            };

            const saveToLocal = () => {
                const data = { userData, questions, answers, timeLeft, violations, activeIdx };
                localStorage.setItem(EXAM_CONFIG.storageKey, JSON.stringify(data));
            };

            const registerViolation = () => {
                const newV = violations + 1;
                setViolations(newV);
                if (newV >= 2) {
                    handleAutoSubmit("Kecurangan Terdeteksi (2x)");
                } else {
                    setModal({
                        isOpen: true, type: "alert", title: "PERINGATAN KERAS!",
                        message: "Anda terdeteksi keluar dari layar ujian atau berpindah tab. Pelanggaran berikutnya akan menghentikan ujian Anda secara otomatis!",
                        confirmText: "Kembali ke Ujian",
                        onConfirm: () => {
                            setModal({ isOpen: false });
                            enterFullscreen();
                        }
                    });
                }
            };

            const enterFullscreen = () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => console.log("Fullscreen blocked"));
                }
            };

            const startExam = (isResume) => {
                if (isResume) {
                    const saved = JSON.parse(localStorage.getItem(EXAM_CONFIG.storageKey));
                    setUserData(saved.userData);
                    setQuestions(saved.questions);
                    setAnswers(saved.answers);
                    setTimeLeft(saved.timeLeft);
                    setViolations(saved.violations);
                    setActiveIdx(saved.activeIdx);
                } else {
                    setQuestions(initializeQuestions());
                    setAnswers({});
                    setTimeLeft(EXAM_CONFIG.durasiMenit * 60);
                    setViolations(0);
                    setActiveIdx(0);
                }
                setView("exam");
                enterFullscreen();
            };

            const handleAutoSubmit = (keterangan) => {
                if (isSubmitting.current) return;
                isSubmitting.current = true;
                setModal({ isOpen: true, type: "alert", title: "Ujian Dihentikan", message: keterangan + ". Sistem sedang memproses nilai Anda...", confirmText: "Harap Tunggu..." });
                processSubmission(keterangan);
            };

            const manualSubmitConfirm = () => {
                setModal({
                    isOpen: true, type: "confirm", title: "Konfirmasi Selesai",
                    message: "Apakah Anda yakin ingin mengumpulkan ujian? Tindakan ini tidak bisa dibatalkan.",
                    confirmText: "Ya, Kumpulkan",
                    onCancel: () => setModal({ isOpen: false }),
                    onConfirm: () => {
                        setModal({ isOpen: false });
                        if (isSubmitting.current) return;
                        isSubmitting.current = true;
                        processSubmission("Selesai Normal");
                    }
                });
            };

            const processSubmission = async (keterangan) => {
                let score = 0;
                let rincianArr = [];
                
                // Urutkan rincian berdasar ID asli agar runtut (1 - 25)
                const sortedOriginals = [...rawQuestionsData].sort((a,b) => a.id - b.id);
                
                sortedOriginals.forEach(orig => {
                    const studentAns = answers[orig.id];
                    let isCorrect = false;
                    let txtDetail = "";

                    if (!studentAns || studentAns.trim() === "") {
                        txtDetail = `Soal ${orig.id}: KOSONG`;
                    } else {
                        if (orig.type === 'mc') {
                            const correctOpt = orig.options.find(o => o.isCorrect).text;
                            if (studentAns === correctOpt) {
                                isCorrect = true;
                                txtDetail = `Soal ${orig.id}: BENAR`;
                            } else {
                                txtDetail = `Soal ${orig.id}: SALAH (Pilih: ${studentAns}, Kunci: ${correctOpt})`;
                            }
                        } else if (orig.type === 'essay') {
                            // Cek kata kunci dasar untuk esai agar memiliki nilai parsial
                            const ansLower = studentAns.toLowerCase();
                            const keys = orig.answer.split(', ');
                            isCorrect = keys.some(k => ansLower.includes(k));
                            
                            if (isCorrect) {
                                txtDetail = `Soal ${orig.id}: BENAR (Esai Jawaban: ${studentAns.substring(0,30)}...)`;
                            } else {
                                txtDetail = `Soal ${orig.id}: SALAH (Esai Jawaban: ${studentAns.substring(0,30)}..., Kunci: ${orig.answer})`;
                            }
                        }
                    }
                    
                    if (isCorrect) score += (100 / rawQuestionsData.length); // Distribusi merata (4 poin/soal)
                    rincianArr.push(txtDetail);
                });

                const finalScore = Math.round(score);
                const rincianStr = rincianArr.join(" | ");

                const payload = {
                    nama: userData.nama,
                    kelas: userData.kelas,
                    tanggal: userData.tanggal,
                    skor: finalScore,
                    pelanggaran: violations,
                    keterangan: keterangan,
                    rincianJawaban: rincianStr
                };

                try {
                    await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                } catch (err) {
                    console.error("Gagal mengirim data ke server", err);
                }

                localStorage.removeItem(EXAM_CONFIG.storageKey);
                if (document.fullscreenElement) document.exitFullscreen().catch(e => e);
                
                setModal({ isOpen: false });
                setView("finished");
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            // ================== RENDER VIEWS ================== //
            if (view === "login") {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
                            <div className="bg-blue-800 p-6 text-white text-center">
                                <h1 className="text-2xl font-bold uppercase tracking-wide">{EXAM_CONFIG.mapel}</h1>
                                <p className="text-blue-200 text-sm mt-1">{EXAM_CONFIG.jenis} - KELAS {EXAM_CONFIG.kelas}</p>
                            </div>
                            <form className="p-8 space-y-5" onSubmit={(e) => { e.preventDefault(); startExam(false); }}>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                                    <input required type="text" className="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" value={userData.nama} onChange={e => setUserData({...userData, nama: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                                    <input required type="text" className="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" value={userData.kelas} onChange={e => setUserData({...userData, kelas: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Tanggal Ujian</label>
                                    <input required type="date" className="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" value={userData.tanggal} onChange={e => setUserData({...userData, tanggal: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg mt-2 transition-colors shadow-lg text-lg">
                                    Mulai Ujian
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (view === "resume") {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm text-center">
                            <IconAlert />
                            <h2 className="text-xl font-bold mb-3 text-gray-800">Sesi Ujian Tersimpan Ditemukan!</h2>
                            <p className="text-gray-600 mb-6 text-sm">Sistem menemukan sesi pengerjaan ujian Anda yang terputus. Apakah Anda ingin melanjutkannya?</p>
                            <div className="flex flex-col gap-3">
                                <button onClick={() => startExam(true)} className="bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-bold shadow-md transition-colors">Lanjutkan Ujian</button>
                                <button onClick={() => { localStorage.removeItem(EXAM_CONFIG.storageKey); setView("login"); }} className="bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-lg font-bold shadow-md transition-colors">Mulai Ulang (Hapus Progres)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === "finished") {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white p-10 rounded-2xl shadow-xl text-center max-w-md w-full border-t-8 border-green-500">
                            <div className="mx-auto w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-6 shadow-inner">
                                <IconCheck />
                            </div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-3">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6 text-lg">Jawaban Anda telah berhasil dikirim ke server. Silakan tutup browser ini.</p>
                        </div>
                    </div>
                );
            }

            // EXAM VIEW
            const activeQ = questions[activeIdx];
            return (
                <div className="flex flex-col h-screen bg-gray-50">
                    <CustomModal {...modal} />
                    
                    {/* Header Navigasi Atas */}
                    <header className="bg-white shadow-sm px-4 md:px-6 py-3 flex justify-between items-center z-10 shrink-0 border-b">
                        <div>
                            <h1 className="text-lg md:text-xl font-bold text-blue-900 uppercase">{EXAM_CONFIG.mapel}</h1>
                            <p className="text-xs md:text-sm text-gray-500 font-medium">{EXAM_CONFIG.jenis} | KELAS {userData.kelas}</p>
                        </div>
                        <div className="flex items-center gap-3 md:gap-5">
                            <div className="hidden md:flex items-center gap-2 text-sm font-bold text-gray-700 bg-gray-100 px-4 py-1.5 rounded-full border">
                                <IconUser /> {userData.nama}
                            </div>
                            <div className={`flex items-center gap-2 font-mono text-lg font-bold px-4 py-1.5 rounded-lg border shadow-sm ${timeLeft < 300 ? 'bg-red-100 text-red-600 border-red-200 animate-pulse' : 'bg-blue-50 text-blue-800 border-blue-200'}`}>
                                <IconClock /> {formatTime(timeLeft)}
                            </div>
                        </div>
                    </header>

                    {/* Konten Utama */}
                    <main className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                        {/* Kolom Kiri: Area Soal */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 relative hide-scrollbar">
                            <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 min-h-full">
                                <div className="flex items-center justify-between mb-6 pb-4 border-b">
                                    <h2 className="text-xl font-bold text-gray-800">Soal No. {activeIdx + 1}</h2>
                                    <span className="text-xs font-semibold px-3 py-1 bg-gray-100 text-gray-500 rounded-full uppercase tracking-wider">{activeQ?.type === 'mc' ? 'Pilihan Ganda' : 'Esai'}</span>
                                </div>
                                
                                <div className="text-lg text-gray-800 leading-relaxed mb-8 whitespace-pre-line font-medium">
                                    {activeQ?.question}
                                    {activeQ?.image && (
                                        <img src={activeQ.image} alt="Ilustrasi Soal" className="mt-5 max-w-full rounded-lg border shadow-sm" />
                                    )}
                                </div>

                                <div className="space-y-4">
                                    {activeQ?.type === 'mc' ? (
                                        activeQ.options.map((opt, i) => (
                                            <label key={i} className={`flex items-start gap-4 p-4 border-2 rounded-xl cursor-pointer transition-all duration-200 ${answers[activeQ.id] === opt.text ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50 border-gray-200'}`}>
                                                <input type="radio" name={`q_${activeQ.id}`} className="mt-1 w-5 h-5 text-blue-600 focus:ring-blue-500 border-gray-300"
                                                    checked={answers[activeQ.id] === opt.text}
                                                    onChange={() => setAnswers(prev => ({...prev, [activeQ.id]: opt.text}))}
                                                />
                                                <span className="text-gray-700 leading-relaxed font-medium">{opt.text}</span>
                                            </label>
                                        ))
                                    ) : (
                                        <div>
                                            <textarea rows="5" placeholder="Ketik jawaban esai/uraian Anda di sini..." 
                                                className="w-full px-4 py-4 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-lg transition-all resize-none shadow-sm"
                                                value={answers[activeQ.id] || ""}
                                                onChange={(e) => setAnswers(prev => ({...prev, [activeQ.id]: e.target.value}))}
                                            />
                                        </div>
                                    )}
                                </div>

                                {/* Navigasi Bawah Area Soal */}
                                <div className="mt-10 pt-6 border-t border-gray-100 flex justify-between items-center">
                                    <button onClick={() => setActiveIdx(i => Math.max(0, i - 1))} disabled={activeIdx === 0}
                                        className="px-6 py-2.5 rounded-xl font-bold text-gray-700 bg-gray-200 hover:bg-gray-300 disabled:opacity-40 transition-colors">
                                        &larr; Sebelumnya
                                    </button>
                                    
                                    {activeIdx === questions.length - 1 ? (
                                        <button onClick={manualSubmitConfirm} className="px-8 py-2.5 rounded-xl font-bold text-white bg-green-600 hover:bg-green-700 shadow-lg transition-colors">
                                            Selesai & Kumpulkan
                                        </button>
                                    ) : (
                                        <button onClick={() => setActiveIdx(i => Math.min(questions.length - 1, i + 1))}
                                            className="px-6 py-2.5 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition-colors">
                                            Selanjutnya &rarr;
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Kolom Kanan: Kotak Navigasi Nomor */}
                        <div className="w-full md:w-80 bg-white border-l border-gray-200 shadow-[-4px_0_15px_-10px_rgba(0,0,0,0.1)] flex flex-col shrink-0 z-10">
                            <div className="p-4 bg-gray-50 border-b font-bold text-gray-700 text-center uppercase tracking-wider text-sm">
                                Navigasi Soal
                            </div>
                            <div className="p-5 overflow-y-auto hide-scrollbar flex-1">
                                <div className="grid grid-cols-5 gap-3">
                                    {questions.map((q, i) => {
                                        const isAnswered = answers[q.id] && answers[q.id].trim() !== "";
                                        const isActive = i === activeIdx;
                                        return (
                                            <button key={q.id} onClick={() => setActiveIdx(i)}
                                                className={`
                                                    h-11 rounded-lg font-bold text-sm transition-all relative border-2 flex items-center justify-center shadow-sm
                                                    ${isActive ? 'ring-4 ring-blue-200 border-blue-500 z-10 scale-105' : 'border-gray-200 hover:border-gray-300'}
                                                    ${isAnswered ? 'bg-green-500 text-white border-green-600' : 'bg-white text-gray-600'}
                                                `}>
                                                {i + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                                <div className="mt-8 pt-6 border-t flex flex-col gap-2 text-xs font-semibold text-gray-500">
                                    <div className="flex items-center gap-2"><span className="w-4 h-4 bg-green-500 rounded block border border-green-600"></span> Sudah Dijawab</div>
                                    <div className="flex items-center gap-2"><span className="w-4 h-4 bg-white rounded block border-2 border-gray-200"></span> Belum Dijawab</div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
