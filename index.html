<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CBT Ujian - Bahasa Arab Kelas VIII</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Anti-Cheat: Mencegah seleksi teks dan klik kanan */
    body {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    /* Izinkan seleksi teks hanya pada input form dan textarea */
    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }
    
    /* Font khusus Bahasa Arab agar lebih terbaca */
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
    .font-arabic {
      font-family: 'Amiri', serif;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ==========================================
    // KONFIGURASI UJIAN
    // ==========================================
    const CONFIG = {
      mapel: "BAHASA ARAB",
      jenisUjian: "SUMATIF AKHIR JENJANG (SAJ) 2025/2026",
      kelas: "VIII",
      durasiMenit: 90,
      storageKey: "cbt_BAHASA_ARAB_VIII",
      googleSheetsUrl: "https://script.google.com/macros/s/AKfycbz_4PlRBN03kigqoEiztltmkLNr7Yd6w8EQQpEaaBlLlmMNCjhKkUYvXQ1F7H_mx2o-ow/exec" // <-- GANTI DENGAN URL WEB APP GOOGLE SCRIPT ANDA
    };

    // ==========================================
    // DATA SOAL (Dari Ekstraksi PDF Bahasa Arab)
    // ==========================================
    const rawQuestionsData = [
      { id: 1, type: 'mc', text: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Kunci"?', options: ['مِفْتَاحٌ', 'بَابٌ', 'نَافِذَةٌ', 'كُرْسِيُّ'], answer: 'مِفْتَاحٌ' },
      { id: 2, type: 'mc', text: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Jendela"?', options: ['مِفْتَاحٌ', 'نَافِذَةٌ', 'سَبُّورَةٌ', 'جَرَسٌ'], answer: 'نَافِذَةٌ' },
      { id: 3, type: 'mc', text: 'مَا مَعْنَى كَلِمَةٍ «سَبُّورَةٌ»؟', options: ['Meja', 'Papan tulis', 'Penghapus', 'Lemari'], answer: 'Papan tulis' },
      { id: 4, type: 'mc', text: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Bel / Lonceng"؟', options: ['مِصْبَاحٌ', 'مِفْتَاحٌ', 'جَرَسٌ', 'كُرْسِيُّ'], answer: 'جَرَسٌ' },
      { id: 5, type: 'mc', text: 'مَا مَعْنَى كَلِمَةٍ «مِصْبَاحٌ»؟', options: ['Lampu', 'Kipas angin', 'Jam', 'Pintu'], answer: 'Lampu' },
      { id: 6, type: 'mc', text: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Kursi"?', options: ['مَكْتَبٌ', 'بَابٌ', 'رَفٌ', 'كُرْسِيُّ'], answer: 'كُرْسِيُّ' },
      { id: 7, type: 'mc', text: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Kapur tulis"؟', options: ['طَبْشُورَةٌ', 'مِسْطَرَةٌ', 'مِمْحَاةٌ', 'كُرَّاسَةٌ'], answer: 'طَبْشُورَةٌ' },
      { id: 8, type: 'mc', text: 'مَا مَعْنَى كَلِمَةٍ «مُكَيِّف»؟', options: ['Kipas angin', 'Pendingin ruangan (AC)', 'Televisi', 'Lampu'], answer: 'Pendingin ruangan (AC)' },
      { id: 9, type: 'mc', text: 'إخْتَرِ الْعِبَارَةَ الصَّحِيحَة لـ "Tembok merah"!', options: ['جِدَارٌ حَمْرَاءُ', 'جِدَارٌ أَحْمَرُ', 'جِدَارٌ صَفْرَاءُ', 'جِدَارٌ أَصْفَرُ'], answer: 'جِدَارٌ أَحْمَرُ' },
      { id: 10, type: 'mc', text: 'إخْتَرِ الْعِبَارَةَ الصَّحِيحَةَ لـ "Jendela biru"!', options: ['نَافِذَةٌ أَزْرَقُ', 'نَافِذَةٌ أَحْمَرُ', 'نَافِذَةٌ زَرْقَاءُ', 'نَافِذَةٌ حَمْرَاءُ'], answer: 'نَافِذَةٌ زَرْقَاءُ' },
      { id: 11, type: 'mc', text: 'مَا هُوَ الْمُؤَنَّث مِنْ كَلِمَةٍ «أَخْضَرُ»؟', options: ['خَضْرَاءُ', 'أَخْضَرُ', 'صَفْرَاءُ', 'حَمْرَاءُ'], answer: 'خَضْرَاءُ' },
      { id: 12, type: 'mc', text: 'مَا هُوَ الْمُذَكَّرُ مِنْ كَلِمَةِ «سَوْدَاءُ»؟', options: ['سَوْدَاءُ', 'أَصْفَرُ', 'أَسْوَدُ', 'أَزْرَقُ'], answer: 'أَسْوَدُ' },
      { id: 13, type: 'mc', text: 'إخْتَرِ التَّرْجَمَةَ الصَّحِيحَةَ لِـ "Papan tulis putih"!', options: ['سَبُّورَةٌ أَبْيَضُ', 'سَبُّورَةٌ بَيْضَاءُ', 'سَبُّورَةٌ سَوْدَاءُ', 'سَبُّورَةٌ أَسْوَدُ'], answer: 'سَبُّورَةٌ بَيْضَاءُ' },
      { id: 14, type: 'mc', text: 'مَا مَعْنَى الْجُمْلَةِ «لَوْنُ الْكِتَابِ أَصْفَرُ»؟', options: ['Warna pintu itu kuning', 'Warna buku itu kuning', 'Warna jam itu merah', 'Warna buku itu merah'], answer: 'Warna buku itu kuning' },
      { id: 15, type: 'mc', text: 'إِمْلَا الْفَرَاغَ بِالضَّمِيرِ الْمُنَاسِب: «الْكِتَابُ لَوْنُ [...] أَزْرَقُ»', options: ['ـهَا', 'ـكَ', 'ـهُ', 'ـي'], answer: 'ـهُ' },
      { id: 16, type: 'mc', text: 'إِمْلَا الْفَرَاغَ بِالضَّمِيرِ الْمُنَاسِب: «السَّاعَةُ لَوْنُ [...] أَسْوَدُ»', options: ['ـهُ', 'ـهَا', 'ـكَ', 'ـنَا'], answer: 'ـهَا' },
      { id: 17, type: 'mc', text: 'تَرْجِمْ إِلَى اللُّغَةِ الْعَرَبِيَّةِ : "Dia (laki-laki) mempunyai pena"!', options: ['عِنْدِي قَلَمٌ', 'عِنْدَهَا قَلَمٌ', 'عِنْدَهُ قَلَمٌ', 'عِنْدَكِ قَلَمٌ'], answer: 'عِنْدَهُ قَلَمٌ' },
      { id: 18, type: 'mc', text: 'تَرْجِمْ إِلَى اللُّغَةِ الْعَرَبِيَّةِ: "Kami mempunyai kelas"!', options: ['عِنْدَنَا فَصْلٌ', 'عِنْدِي فَصْلٌ', 'عِنْدَهُ فَصْلٌ', 'عِنْدَكَ فَصْلٌ'], answer: 'عِنْدَنَا فَصْلٌ' },
      { id: 19, type: 'mc', text: 'تَرْجِمْ إِلَى اللُّغَةِ الْعَرَبِيَّةِ : "Kamu (perempuan) mempunyai buku"!', options: ['عِنْدَكَ كِتَابٌ', 'عِنْدَكِ كِتَابٌ', 'عِنْدِي كِتَابٌ', 'عِنْدَهَا كِتَابٌ'], answer: 'عِنْدَكِ كِتَابٌ' },
      { id: 20, type: 'mc', text: 'تَرْجِمْ إِلَى اللُّغَةِ الْعَرَبِيَّةِ : "Saya mempunyai penghapus"!', options: ['عِنْدَهُ طَلَّاسَةٌ', 'عِنْدَهَا طَلَّاسَةٌ', 'عِنْدَكَ طَلَّاسَةٌ', 'عِنْدِي طَلَّاسَةٌ'], answer: 'عِنْدِي طَلَّاسَةٌ' },
      { 
        id: 21, 
        type: 'matching', 
        text: 'Jodohkanlah pertanyaan pada Kolom A dengan jawaban yang tepat pada Kolom B! (وَفِّقْ بَيْنَ الْأَسْئِلَةِ وَالْإِجَابَةِ الصَّحِيحَةِ)', 
        pairs: [
          { id: 'p1', premise: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Pintu"?', answer: 'بَابٌ' },
          { id: 'p2', premise: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Rak"?', answer: 'رَفٌ' },
          { id: 'p3', premise: 'مَا اللُّغَةُ الْعَرَبِيَّةُ لِكَلِمَةِ "Proyektor"?', answer: 'بَرُوجِكْتُر' },
          { id: 'p4', premise: 'مَا مَعْنَى كَلِمَةٍ أَبْيَضُ فِي مِفْتَاحٌ أَبْيَضُ؟', answer: 'Putih' },
          { id: 'p5', premise: 'مَا مَعْنَى كَلِمَةٍ سَوْدَاءُ فِي سَاعَةٌ سَوْدَاءُ؟', answer: 'Hitam' },
          { id: 'p6', premise: 'إِمْلَا الْفَرَاغَ لـ "Jendela kuning" : نَافِذَةٌ [...]', answer: 'صَفْرَاءُ' },
          { id: 'p7', premise: 'إِمْلَا الْفَرَاغُ "Warna buku kuning" : [...] لَوْنُ الْكِتَابِ', answer: 'أَصْفَرُ' },
          { id: 'p8', premise: 'الضَّمِيرُ الْمُنَاسِبُ "Buku itu warnanya merah" : الْكِتَابُ لَوْنُ [...] أَحْمَرُ', answer: 'ـهُ' },
          { id: 'p9', premise: 'الضَّمِيرُ الْمُنَاسِبُ "Jam itu warnanya hitam" : السَّاعَةُ لَوْنُ [...] أَسْوَدُ', answer: 'ـهَا' },
          { id: 'p10', premise: 'الْكَلِمَةُ الْمُنَاسِبَةُ لِـ "Saya mempunyai buku" : [...] كِتَابٌ', answer: 'عِنْدِي' }
        ],
        options: ['بَابٌ', 'رَفٌ', 'بَرُوجِكْتُر', 'Putih', 'Hitam', 'صَفْرَاءُ', 'أَصْفَرُ', 'ـهُ', 'ـهَا', 'عِنْدِي']
      }
    ];

    // ==========================================
    // UTILITAS & PENANGANAN RTL (ARAB)
    // ==========================================
    const shuffleArray = (array) => {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    const generateShuffledQuestions = () => {
      let shuffled = shuffleArray(rawQuestionsData);
      return shuffled.map(q => {
        if (q.type === 'mc') return { ...q, options: shuffleArray(q.options) };
        if (q.type === 'matching') return { ...q, options: shuffleArray(q.options) };
        return q;
      });
    };

    const isArabic = (text) => /[\u0600-\u06FF]/.test(text);

    const FormattedText = ({ text }) => {
      if (isArabic(text)) {
        return <div dir="rtl" className="text-right text-2xl font-bold font-arabic leading-loose text-gray-800">{text}</div>;
      }
      return <div className="text-left text-lg text-gray-800 leading-relaxed whitespace-pre-wrap">{text}</div>;
    };

    const FormattedOption = ({ text }) => {
      if (isArabic(text)) {
        return <span dir="rtl" className="text-right text-xl font-bold font-arabic block w-full">{text}</span>;
      }
      return <span>{text}</span>;
    };

    // ==========================================
    // KOMPONEN IKON & MODAL (Anti-Crash)
    // ==========================================
    const IconAlert = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-12 w-12 text-red-500 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    );

    const CustomModal = ({ isOpen, type, title, message, onConfirm, confirmText, onCancel, cancelText }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
          <div className="bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-md text-center">
            {type === 'alert' && <IconAlert />}
            <h3 className="text-xl font-bold mt-4 text-gray-800">{title}</h3>
            <p className="text-gray-600 mt-2">{message}</p>
            <div className="mt-6 flex justify-center gap-4">
              {onCancel && (
                <button onClick={onCancel} className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300">
                  {cancelText || 'Batal'}
                </button>
              )}
              <button onClick={onConfirm} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">
                {confirmText || 'OK'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // APLIKASI UTAMA
    // ==========================================
    const App = () => {
      const [sessionChecked, setSessionChecked] = useState(false);
      const [hasSavedSession, setHasSavedSession] = useState(false);
      
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [isFinished, setIsFinished] = useState(false);
      
      const [studentData, setStudentData] = useState({ nama: '', kelas: '', tanggal: new Date().toISOString().split('T')[0] });
      const [questions, setQuestions] = useState([]);
      const [answers, setAnswers] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(CONFIG.durasiMenit * 60);
      const [violations, setViolations] = useState(0);
      
      const [modalState, setModalState] = useState({ isOpen: false });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [finalResult, setFinalResult] = useState(null);

      // Cek Session LocalStorage
      useEffect(() => {
        const saved = localStorage.getItem(CONFIG.storageKey);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (!parsed.isFinished && parsed.questions && parsed.timeLeft > 0) setHasSavedSession(true);
            else localStorage.removeItem(CONFIG.storageKey);
          } catch(e) { localStorage.removeItem(CONFIG.storageKey); }
        }
        setSessionChecked(true);
      }, []);

      // Auto-Save
      useEffect(() => {
        if (isLoggedIn && !isFinished) {
          localStorage.setItem(CONFIG.storageKey, JSON.stringify({ studentData, questions, answers, currentIndex, timeLeft, violations, isFinished }));
        }
      }, [isLoggedIn, isFinished, studentData, questions, answers, currentIndex, timeLeft, violations]);

      // Timer
      useEffect(() => {
        if (!isLoggedIn || isFinished) return;
        const timerId = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerId);
              handleAutoSubmit("WAKTU_HABIS");
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timerId);
      }, [isLoggedIn, isFinished]);

      // Strict Anti-Cheat
      useEffect(() => {
        if (!isLoggedIn || isFinished) return;
        const handleCheat = () => {
          if (modalState.isOpen && modalState.type === 'alert') return;
          setViolations(v => {
            const nv = v + 1;
            if (nv === 1) showModal('alert', 'PERINGATAN!', 'Dilarang keluar dari layar ujian atau berpindah tab!', () => setModalState({isOpen: false}));
            else if (nv >= 2) handleAutoSubmit("PELANGGARAN_KECURANGAN");
            return nv;
          });
        };
        const onVis = () => { if (document.hidden) handleCheat(); };
        const onFs = () => { if (!document.fullscreenElement) handleCheat(); };
        document.addEventListener('visibilitychange', onVis);
        document.addEventListener('fullscreenchange', onFs);
        return () => { document.removeEventListener('visibilitychange', onVis); document.removeEventListener('fullscreenchange', onFs); };
      }, [isLoggedIn, isFinished, modalState.isOpen]);

      const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
      const showModal = (type, title, msg, onConfirm, onCancel, btnConfirm) => setModalState({ isOpen: true, type, title, message: msg, onConfirm, onCancel, confirmText: btnConfirm });

      const enterExam = () => {
        document.documentElement.requestFullscreen().catch(() => {});
        setIsLoggedIn(true);
      };

      const handleStartNew = (e) => {
        e.preventDefault();
        setQuestions(generateShuffledQuestions());
        enterExam();
      };

      const handleResume = () => {
        const d = JSON.parse(localStorage.getItem(CONFIG.storageKey));
        setStudentData(d.studentData); setQuestions(d.questions); setAnswers(d.answers);
        setCurrentIndex(d.currentIndex); setTimeLeft(d.timeLeft); setViolations(d.violations);
        enterExam();
      };

      // Handle Jawaban
      const handleSelectOption = (qId, option) => setAnswers(prev => ({ ...prev, [qId]: option }));
      const handleInputText = (qId, text) => setAnswers(prev => ({ ...prev, [qId]: text }));
      const handleMatchingSelect = (qId, pairId, value) => {
        setAnswers(prev => ({ ...prev, [qId]: { ...(prev[qId] || {}), [pairId]: value } }));
      };

      // Kumpulkan Jawaban
      const reqSubmit = () => showModal('confirm', 'Kumpulkan?', 'Kirim lembar ujian sekarang?', 
        () => { setModalState({isOpen: false}); handleAutoSubmit("SELESAI_NORMAL"); },
        () => setModalState({isOpen: false}), 'Kumpulkan'
      );

      const handleAutoSubmit = async (ket) => {
        setIsFinished(true); setIsSubmitting(true);
        if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});

        let pgBenar = 0;
        let totalBobotPG = 0; 
        let rincianArr = [];
        let esaiArr = [];
        
        const sortedOriginal = [...rawQuestionsData].sort((a,b) => a.id - b.id);
        
        sortedOriginal.forEach(q => {
          const uAns = answers[q.id];
          
          if (q.type === 'mc' || q.type === 'short_answer') {
            totalBobotPG++;
            if (!uAns) rincianArr.push(`Soal ${q.id}: KOSONG`);
            else if (uAns === q.answer) { pgBenar++; rincianArr.push(`Soal ${q.id}: BENAR`); }
            else rincianArr.push(`Soal ${q.id}: SALAH (Pilih: ${uAns}, Kunci: ${q.answer})`);
          } 
          else if (q.type === 'matching') {
            let matchDetails = [];
            q.pairs.forEach(pair => {
              totalBobotPG++;
              const pAns = uAns ? uAns[pair.id] : null;
              if (!pAns) matchDetails.push(`[${pair.premise} = KOSONG]`);
              else if (pAns === pair.answer) { pgBenar++; matchDetails.push(`[${pair.premise} = ${pAns} (BENAR)]`); }
              else matchDetails.push(`[${pair.premise} = ${pAns} (SALAH, Kunci: ${pair.answer})]`);
            });
            rincianArr.push(`Soal ${q.id} (Menjodohkan): ${matchDetails.join(" | ")}`);
          }
          else if (q.type === 'essay') {
            if (!uAns || !uAns.trim()) {
              esaiArr.push(`Soal ${q.id}: [KOSONG]`); rincianArr.push(`Soal ${q.id}: KOSONG`);
            } else {
              const safeText = uAns.trim().replace(/\n/g, '\\n');
              esaiArr.push(`Soal ${q.id}: ${safeText}`); rincianArr.push(`Soal ${q.id} (Esai): ${safeText}`);
            }
          }
        });

        const nilaiOtomatis = totalBobotPG > 0 ? (pgBenar / totalBobotPG) * 100 : 0;
        
        const payload = {
          waktuSubmit: new Date().toLocaleString('id-ID'),
          nama: studentData.nama, kelas: studentData.kelas, tanggal: studentData.tanggal,
          skor: nilaiOtomatis.toFixed(2), esai: esaiArr.join("\n\n"),
          pelanggaran: violations, keterangan: ket, rincian: rincianArr.join(" | ")
        };

        try {
          await fetch(CONFIG.googleSheetsUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
          setFinalResult({ ...payload }); localStorage.removeItem(CONFIG.storageKey);
        } catch (e) {
          alert("Koneksi gagal. Jawaban tersimpan di memori perangkat.");
          setFinalResult({ ...payload, error: true });
        }
        setIsSubmitting(false);
      };

      if (!sessionChecked) return null;

      // =========================== UI LOGIN ===========================
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white/95 backdrop-blur-md rounded-xl shadow-2xl p-8 max-w-md w-full border-t-4 border-blue-500">
              <h1 className="text-3xl font-extrabold text-center text-gray-800 mb-1">{CONFIG.mapel}</h1>
              <h2 className="text-sm font-semibold text-center text-blue-600 mb-8 uppercase tracking-wide">{CONFIG.jenisUjian} - KELAS {CONFIG.kelas}</h2>
              {hasSavedSession ? (
                <div className="bg-yellow-50 border border-yellow-200 rounded p-5 text-center mb-6">
                  <h3 className="font-bold text-yellow-700 mb-2">Sesi Tersimpan Ditemukan!</h3>
                  <button onClick={handleResume} className="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 mb-2">Lanjutkan Ujian</button>
                  <button onClick={() => { localStorage.removeItem(CONFIG.storageKey); setHasSavedSession(false); }} className="w-full bg-gray-200 text-gray-700 font-bold py-2 rounded hover:bg-gray-300">Mulai Ulang</button>
                </div>
              ) : (
                <form onSubmit={handleStartNew} className="space-y-4">
                  <div>
                    <label className="block text-gray-700 font-bold mb-1">Nama Lengkap</label>
                    <input required value={studentData.nama} onChange={e=>setStudentData({...studentData, nama:e.target.value.toUpperCase()})} className="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                  </div>
                  <div>
                    <label className="block text-gray-700 font-bold mb-1">Kelas</label>
                    <input required value={studentData.kelas} onChange={e=>setStudentData({...studentData, kelas:e.target.value.toUpperCase()})} className="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                  </div>
                  <button className="w-full mt-4 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transition">Mulai Ujian</button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // =========================== UI HASIL ===========================
      if (isFinished) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white rounded-xl shadow-2xl p-8 max-w-lg w-full text-center">
              {isSubmitting ? (
                <div><h2 className="text-2xl font-bold mb-4">Mengirim Data...</h2><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div></div>
              ) : (
                <div>
                  <h2 className="text-2xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                  <div className="bg-gray-50 border rounded-lg p-4 text-left mb-6">
                    <p><strong>Nama:</strong> {studentData.nama}</p>
                    <p className="mt-2">Nilai Objektif (PG/Menjodohkan): <span className="font-bold text-blue-600 text-lg">{finalResult?.skor}</span></p>
                  </div>
                  <button onClick={() => window.location.reload()} className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">Kembali</button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // =========================== UI UJIAN ===========================
      const q = questions[currentIndex];
      
      return (
        <div className="min-h-screen bg-gray-100 flex flex-col relative">
          <CustomModal {...modalState} />

          <header className="bg-white shadow-md px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div>
              <h1 className="text-xl font-bold text-gray-800 uppercase">{CONFIG.mapel}</h1>
              <p className="text-xs font-semibold text-gray-500">{studentData.nama} - {studentData.kelas}</p>
            </div>
            <div className={`font-mono text-xl font-bold px-4 py-1 rounded-lg ${timeLeft<300 ? 'bg-red-100 text-red-600 animate-pulse':'bg-blue-100 text-blue-800'}`}>
              {formatTime(timeLeft)}
            </div>
          </header>

          <div className="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
            
            <main className="flex-1 bg-white rounded-xl shadow-sm border p-6 flex flex-col">
              <div className="flex justify-between border-b pb-3 mb-6">
                <h2 className="text-lg font-bold text-gray-700">Soal Nomor {currentIndex + 1}</h2>
                {q.type === 'matching' && <span className="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-1 rounded">MENJODOHKAN</span>}
              </div>

              <FormattedText text={q.text} />

              <div className="mt-8 flex-1 flex flex-col gap-3">
                {q.type === 'mc' && q.options.map((opt, i) => {
                  const isSelected = answers[q.id] === opt;
                  return (
                    <div key={i} onClick={() => handleSelectOption(q.id, opt)} className={`p-4 border rounded-xl cursor-pointer transition ${isSelected ? 'bg-blue-50 border-blue-500':'hover:bg-gray-50'}`}>
                      <div className="flex items-center gap-3">
                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isSelected?'border-blue-500 bg-blue-500':'border-gray-300'}`}>
                          {isSelected && <div className="w-2.5 h-2.5 rounded-full bg-white"></div>}
                        </div>
                        <FormattedOption text={opt} />
                      </div>
                    </div>
                  )
                })}
                
                {q.type === 'matching' && (
                  <div className="flex flex-col gap-4 mt-4">
                    {q.pairs.map((pair) => (
                      <div key={pair.id} className="flex flex-col md:flex-row bg-gray-50 p-4 border rounded-lg gap-4 items-center">
                        <div className="w-full md:w-1/2">
                          <FormattedText text={pair.premise} />
                        </div>
                        <div className="w-full md:w-1/2">
                          <select 
                            className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 font-arabic text-lg"
                            dir={isArabic(answers[q.id]?.[pair.id] || q.options[0]) ? "rtl" : "ltr"}
                            value={answers[q.id]?.[pair.id] || ''}
                            onChange={(e) => handleMatchingSelect(q.id, pair.id, e.target.value)}
                          >
                            <option value="">-- Pilih Pasangan --</option>
                            {q.options.map((opt, i) => (
                              <option key={i} value={opt}>{opt}</option>
                            ))}
                          </select>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                
                {q.type === 'essay' && (
                  <textarea className="w-full flex-1 p-4 border rounded-xl focus:ring-2 focus:ring-blue-500 min-h-[200px]" value={answers[q.id]||''} onChange={e=>handleInputText(q.id, e.target.value)}></textarea>
                )}
              </div>

              <div className="mt-8 pt-4 border-t flex justify-between">
                <button onClick={()=>setCurrentIndex(p=>Math.max(0, p-1))} disabled={currentIndex===0} className="px-5 py-2.5 bg-gray-200 rounded font-semibold">&laquo; Sebelumnya</button>
                {currentIndex === questions.length - 1 ? (
                  <button onClick={reqSubmit} className="px-5 py-2.5 bg-green-600 text-white rounded font-bold shadow">Selesai & Kumpulkan</button>
                ) : (
                  <button onClick={()=>setCurrentIndex(p=>Math.min(questions.length-1, p+1))} className="px-5 py-2.5 bg-blue-600 text-white rounded font-semibold shadow">Selanjutnya &raquo;</button>
                )}
              </div>
            </main>

            <aside className="w-full lg:w-72 bg-white rounded-xl shadow-sm border p-5 h-fit">
              <h3 className="font-bold text-gray-700 mb-4 border-b pb-2">Navigasi</h3>
              <div className="grid grid-cols-5 gap-2">
                {questions.map((qst, idx) => {
                  let isAns = false;
                  if (qst.type === 'mc' || qst.type === 'short_answer') isAns = !!answers[qst.id];
                  else if (qst.type === 'essay') isAns = !!(answers[qst.id] && answers[qst.id].trim());
                  else if (qst.type === 'matching') {
                    const savedPair = answers[qst.id];
                    isAns = savedPair && Object.keys(savedPair).length === qst.pairs.length && Object.values(savedPair).every(v=>v!=="");
                  }
                  return (
                    <button key={qst.id} onClick={()=>setCurrentIndex(idx)}
                      className={`h-10 rounded font-bold text-sm transition ${currentIndex===idx?'ring-2 ring-blue-600':''} ${isAns?'bg-green-500 text-white':'bg-white border hover:bg-gray-100'}`}
                    >{idx + 1}</button>
                  );
                })}
              </div>
            </aside>
            
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
